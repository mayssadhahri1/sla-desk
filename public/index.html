<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SLA Desk — Support client et suivi des SLA</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Écran de connexion -->
  <section id="login-view" class="login" hidden>
    <div class="login-card">
      <div class="brand brand-lg"><span class="logo">SD</span><div><h1>SLA Desk</h1><p>Support client et suivi des SLA</p></div></div>
      <form id="login-form" class="stack">
        <label>E-mail<input id="login-email" type="email" required autocomplete="username" /></label>
        <label>Mot de passe<input id="login-password" type="password" required autocomplete="current-password" /></label>
        <button class="btn btn-primary" type="submit">Se connecter</button>
        <p id="login-error" class="error" hidden></p>
      </form>
      <div class="demo">
        <p>Comptes de démonstration — mot de passe <code>Demo1234!</code></p>
        <div class="demo-buttons">
          <button class="btn btn-ghost btn-sm" data-demo="admin@sladesk.dev">Admin</button>
          <button class="btn btn-ghost btn-sm" data-demo="agent@sladesk.dev">Agent</button>
          <button class="btn btn-ghost btn-sm" data-demo="client@sladesk.dev">Client</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Application -->
  <div id="app-view" hidden>
    <header class="topbar">
      <div class="brand"><span class="logo">SD</span><div><h1>SLA Desk</h1><p>Support client et suivi des SLA</p></div></div>
      <div class="topbar-right">
        <span id="user-badge" class="user-badge"></span>
        <button id="logout" class="btn btn-ghost-dark btn-sm">Déconnexion</button>
      </div>
    </header>

    <main class="container">
      <section class="kpis" id="kpis"></section>

      <section class="grid-3">
        <div class="card"><h2>Par priorité</h2><div id="chart-priority" class="bars"></div></div>
        <div class="card"><h2>Par statut</h2><div id="chart-status" class="bars"></div></div>
        <div class="card"><h2>Charge des agents</h2><div id="chart-workload" class="bars"></div></div>
      </section>

      <section class="card">
        <div class="toolbar">
          <h2>Tickets</h2>
          <div class="filters">
            <input id="f-search" type="search" placeholder="Rechercher…" />
            <select id="f-status">
              <option value="">Tous les statuts</option>
              <option value="open">Ouvert</option>
              <option value="in_progress">En cours</option>
              <option value="resolved">Résolu</option>
              <option value="closed">Fermé</option>
            </select>
            <select id="f-priority">
              <option value="">Toutes priorités</option>
              <option value="critical">Critique</option>
              <option value="high">Haute</option>
              <option value="medium">Moyenne</option>
              <option value="low">Basse</option>
            </select>
            <button id="new-ticket" class="btn btn-primary btn-sm">＋ Nouveau ticket</button>
          </div>
        </div>
        <div class="table-wrap">
          <table class="tickets">
            <thead><tr><th>#</th><th>Sujet</th><th>Priorité</th><th>Statut</th><th>Demandeur</th><th>Agent</th><th>SLA</th></tr></thead>
            <tbody id="ticket-rows"></tbody>
          </table>
        </div>
        <div class="pager"><button id="prev" class="btn btn-ghost btn-sm">‹ Précédent</button><span id="page-info"></span><button id="next" class="btn btn-ghost btn-sm">Suivant ›</button></div>
      </section>
    </main>
  </div>

  <!-- Panneau de détail d'un ticket -->
  <aside id="drawer" class="drawer" hidden>
    <div class="drawer-panel">
      <button id="drawer-close" class="icon-btn" aria-label="Fermer">✕</button>
      <div id="drawer-content"></div>
    </div>
  </aside>

  <!-- Fenêtre de création de ticket -->
  <dialog id="ticket-dialog">
    <form id="ticket-form" class="stack" method="dialog">
      <h2>Nouveau ticket</h2>
      <label>Sujet<input id="t-title" required minlength="5" maxlength="150" /></label>
      <label>Description<textarea id="t-description" rows="5" required minlength="10"></textarea></label>
      <div class="row">
        <label>Priorité
          <select id="t-priority">
            <option value="low">Basse — résolution 5 j</option>
            <option value="medium" selected>Moyenne — résolution 72 h</option>
            <option value="high">Haute — résolution 24 h</option>
            <option value="critical">Critique — résolution 4 h</option>
          </select>
        </label>
        <label>Catégorie
          <select id="t-category">
            <option value="bug">Bug</option>
            <option value="access">Accès</option>
            <option value="billing">Facturation</option>
            <option value="feature">Demande d'évolution</option>
            <option value="other" selected>Autre</option>
          </select>
        </label>
      </div>
      <p id="ticket-error" class="error" hidden></p>
      <div class="actions">
        <button type="button" id="ticket-cancel" class="btn btn-ghost">Annuler</button>
        <button type="submit" class="btn btn-primary">Créer le ticket</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
